[package]
name = "dashboard-app"
version = "1.0.12"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dashboard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2.4.0"
iroh = "1.3.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
tokio = { version = "1.53.2", features = ["full"] }
local-ip-address = "0.6.13"
socket2 = "0.6.5"
gethostname = "1.1.0"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
